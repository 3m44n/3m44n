<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 180" width="100%" height="180">
  <defs>
    <linearGradient id="bgMesh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0d1322" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="wire" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7dcfff" />
      <stop offset="50%" stop-color="#bb9af7" />
      <stop offset="100%" stop-color="#9ece6a" />
    </linearGradient>
  </defs>

  <style>
    .box-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      fill: #e2e8f0;
      letter-spacing: 1.5px;
    }
    .box-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      fill: #94a3b8;
    }
    .mesh-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      fill: #7dcfff;
      letter-spacing: 2px;
    }
    .pulse-packet {
      animation: travel 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes travel {
      0% { transform: translateX(0px); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateX(300px); opacity: 0; }
    }
  </style>

  <rect width="1000" height="180" rx="12" fill="url(#bgMesh)" stroke="#1e293b" stroke-width="1" />

  <!-- Left Node: Workstation -->
  <rect x="40" y="35" width="290" height="110" rx="10" fill="#0b101d" stroke="#7dcfff" stroke-width="1" stroke-opacity="0.5" />
  <text x="185" y="72" text-anchor="middle" class="box-title">WORKSTATION // x86_64</text>
  <text x="185" y="98" text-anchor="middle" class="box-sub">Arch Linux · Hyprland · Wayland</text>
  <text x="185" y="118" text-anchor="middle" class="box-sub">fish shell · Web &amp; SysAdmin</text>

  <!-- Encrypted Mesh Bridge -->
  <line x1="330" y1="90" x2="670" y2="90" stroke="url(#wire)" stroke-width="1.5" stroke-dasharray="6 6" />
  <circle class="pulse-packet" cx="345" cy="90" r="4" fill="#7dcfff" />
  <text x="500" y="73" text-anchor="middle" class="mesh-label">TAILSCALE WIREGUARD MESH</text>
  <text x="500" y="114" text-anchor="middle" class="box-sub">Encrypted SSH · Container Sync</text>

  <!-- Right Node: Pocket Server -->
  <rect x="670" y="35" width="290" height="110" rx="10" fill="#0b101d" stroke="#bb9af7" stroke-width="1" stroke-opacity="0.5" />
  <text x="815" y="72" text-anchor="middle" class="box-title">POCKET NODE // aarch64</text>
  <text x="815" y="98" text-anchor="middle" class="box-sub">Xiaomi Redmi 8 · postmarketOS</text>
  <text x="815" y="118" text-anchor="middle" class="box-sub">Docker · Jellyfin · rclone</text>
</svg>