<path d="M0,-49 L-3.6,-56 H3.6 Z" fill="#cdbfff"/>
<text class="mono" x="0" y="5.8" font-size="17" text-anchor="middle" fill="#cdbfff">&lt;/&gt;</text></g>
<rect x="146" y="298" width="1" height="74" fill="#2a2538"/>
<text class="sans" x="170" y="308" font-size="18" font-weight="300" fill="#f1ecfb" letter-spacing=".3">Development &amp; automation</text>
<text class="serif" x="170" y="334" font-size="13.5" fill="#b9b2cc">Websites, bots, scripts, and the small machinery that keeps running while I sleep.</text>
<text class="serif" x="170" y="354" font-size="13.5" fill="#b9b2cc">Deployment, hosting, and open-source experiments, one repository at a time.</text>
<rect x="170.0" y="366" width="68.2" height="22" rx="11" fill="#171421" stroke="#3a3350"/><text x="204.1" y="381" font-size="11" text-anchor="middle" fill="#cdbfff" textLength="46.2" lengthAdjust="spacing">web dev</text>
<rect x="246.2" y="366" width="48.4" height="22" rx="11" fill="#171421" stroke="#3a3350"/><text x="270.4" y="381" font-size="11" text-anchor="middle" fill="#cdbfff" textLength="26.4" lengthAdjust="spacing">bots</text>
<rect x="302.6" y="366" width="68.2" height="22" rx="11" fill="#171421" stroke="#3a3350"/><text x="336.7" y="381" font-size="11" text-anchor="middle" fill="#cdbfff" textLength="46.2" lengthAdjust="spacing">scripts</text>
<rect x="378.8" y="366" width="88.0" height="22" rx="11" fill="#171421" stroke="#3a3350"/><text x="422.8" y="381" font-size="11" text-anchor="middle" fill="#cdbfff" textLength="66.0" lengthAdjust="spacing">deployment</text>
<rect x="474.8" y="366" width="68.2" height="22" rx="11" fill="#171421" stroke="#3a3350"/><text x="508.9" y="381" font-size="11" text-anchor="middle" fill="#cdbfff" textLength="46.2" lengthAdjust="spacing">hosting</text>
<rect x="551.0" y="366" width="94.6" height="22" rx="11" fill="#171421" stroke="#3a3350"/><text x="598.3" y="381" font-size="11" text-anchor="middle" fill="#cdbfff" textLength="72.6" lengthAdjust="spacing">open source</text>
