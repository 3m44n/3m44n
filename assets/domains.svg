<path d="M0,-49 L-3.6,-56 H3.6 Z" fill="#cdbfff"/>
<text class="mono" x="0" y="5.8" font-size="17" text-anchor="middle" fill="#cdbfff">❯_</text></g>
<rect x="146" y="26" width="1" height="74" fill="#2a2538"/>
<text class="sans" x="170" y="36" font-size="18" font-weight="300" fill="#f1ecfb" letter-spacing=".3">Linux &amp; systems</text>
<text class="serif" x="170" y="62" font-size="13.5" fill="#b9b2cc">Arch is the daily driver: Hyprland on Wayland, fish in the shell, every config bent into shape by hand.</text>
<text class="serif" x="170" y="82" font-size="13.5" fill="#b9b2cc">I like things lean, fast, and understood all the way down to the bootloader.</text>
<rect x="170.0" y="94" width="88.0" height="22" rx="11" fill="#171421" stroke="#3a3350"/><text x="214.0" y="109" font-size="11" text-anchor="middle" fill="#cdbfff" textLength="66.0" lengthAdjust="spacing">arch linux</text>
<rect x="266.0" y="94" width="74.8" height="22" rx="11" fill="#171421" stroke="#3a3350"/><text x="303.4" y="109" font-size="11" text-anchor="middle" fill="#cdbfff" textLength="52.8" lengthAdjust="spacing">hyprland</text>
<rect x="348.8" y="94" width="68.2" height="22" rx="11" fill="#171421" stroke="#3a3350"/><text x="382.9" y="109" font-size="11" text-anchor="middle" fill="#cdbfff" textLength="46.2" lengthAdjust="spacing">wayland</text>
