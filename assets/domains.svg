<circle r="32" fill="#171421" stroke="#cdbfff" stroke-opacity=".4"/>
<path d="M0,-49 L-3.6,-56 H3.6 Z" fill="#cdbfff"/>
<text class="serif" x="0" y="9.5" font-size="28" text-anchor="middle" fill="#cdbfff">Ψ</text></g>
<rect x="146" y="570" width="1" height="74" fill="#2a2538"/>
<text class="sans" x="170" y="580" font-size="18" font-weight="300" fill="#f1ecfb" letter-spacing=".3">Minds &amp; stories</text>
<text class="serif" x="170" y="606" font-size="13.5" fill="#b9b2cc">Psychological storytelling, strategy, philosophy. Narratives where every move is planned</text>
<text class="serif" x="170" y="626" font-size="13.5" fill="#b9b2cc">three moves ahead: Monster, Death Note, Interstellar, Inception, Breaking Bad.</text>
<rect x="170.0" y="638" width="74.8" height="22" rx="11" fill="#171421" stroke="#3a3350"/><text x="207.4" y="653" font-size="11" text-anchor="middle" fill="#cdbfff" textLength="52.8" lengthAdjust="spacing">strategy</text>
<rect x="252.8" y="638" width="88.0" height="22" rx="11" fill="#171421" stroke="#3a3350"/><text x="296.8" y="653" font-size="11" text-anchor="middle" fill="#cdbfff" textLength="66.0" lengthAdjust="spacing">philosophy</text>
<rect x="348.8" y="638" width="88.0" height="22" rx="11" fill="#171421" stroke="#3a3350"/><text x="392.8" y="653" font-size="11" text-anchor="middle" fill="#cdbfff" textLength="66.0" lengthAdjust="spacing">psychology</text>
<rect x="444.8" y="638" width="107.8" height="22" rx="11" fill="#171421" stroke="#3a3350"/><text x="498.7" y="653" font-size="11" text-anchor="middle" fill="#cdbfff" textLength="85.8" lengthAdjust="spacing">deep thinking</text>
