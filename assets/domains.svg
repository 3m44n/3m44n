<path d="M0,-49 L-3.6,-56 H3.6 Z" fill="#cdbfff"/>
<text class="mono" x="0" y="8.2" font-size="24" text-anchor="middle" fill="#cdbfff">⇄</text></g>
<rect x="146" y="162" width="1" height="74" fill="#2a2538"/>
<text class="sans" x="170" y="172" font-size="18" font-weight="300" fill="#f1ecfb" letter-spacing=".3">Self-hosting &amp; infrastructure</text>
<text class="serif" x="170" y="198" font-size="13.5" fill="#b9b2cc">A Xiaomi Redmi 8, retired from phone duty and reborn as an ARM64 Linux server.</text>
<text class="serif" x="170" y="218" font-size="13.5" fill="#b9b2cc">Old hardware is just potential nobody has bothered to unlock yet.</text>
<rect x="170.0" y="230" width="101.2" height="22" rx="11" fill="#171421" stroke="#3a3350"/><text x="220.6" y="245" font-size="11" text-anchor="middle" fill="#cdbfff" textLength="79.2" lengthAdjust="spacing">postmarketOS</text>
<rect x="279.2" y="230" width="61.6" height="22" rx="11" fill="#171421" stroke="#3a3350"/><text x="310.0" y="245" font-size="11" text-anchor="middle" fill="#cdbfff" textLength="39.6" lengthAdjust="spacing">alpine</text>
<rect x="348.8" y="230" width="48.4" height="22" rx="11" fill="#171421" stroke="#3a3350"/><text x="373.0" y="245" font-size="11" text-anchor="middle" fill="#cdbfff" textLength="26.4" lengthAdjust="spacing">nura</text>
<rect x="405.2" y="230" width="61.6" height="22" rx="11" fill="#171421" stroke="#3a3350"/><text x="436.0" y="245" font-size="11" text-anchor="middle" fill="#cdbfff" textLength="39.6" lengthAdjust="spacing">docker</text>
