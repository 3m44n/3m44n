<rect x="610.4" y="94" width="114.4" height="22" rx="11" fill="#171421" stroke="#3a3350"/><text x="667.6" y="109" font-size="11" text-anchor="middle" fill="#cdbfff" textLength="92.4" lengthAdjust="spacing">kernels &amp; boot</text>
<rect x="732.8" y="94" width="74.8" height="22" rx="11" fill="#171421" stroke="#3a3350"/><text x="770.2" y="109" font-size="11" text-anchor="middle" fill="#cdbfff" textLength="52.8" lengthAdjust="spacing">sysadmin</text>
<rect x=".75" y="136.75" width="898.5" height="124.5" rx="14" fill="#100e18" stroke="#2a2538" stroke-width="1.5"/>
