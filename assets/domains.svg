<path d="M0,-49 L-3.6,-56 H3.6 Z" fill="#cdbfff"/>
<text class="serif" x="0" y="10.2" font-size="30" text-anchor="middle" fill="#cdbfff">∫</text></g>
<rect x="146" y="434" width="1" height="74" fill="#2a2538"/>
<text class="sans" x="170" y="444" font-size="18" font-weight="300" fill="#f1ecfb" letter-spacing=".3">Science &amp; academics</text>
<text class="serif" x="170" y="470" font-size="13.5" fill="#b9b2cc">IIT-JEE Main 2027 is the mission. Physics and mathematics are the pull:</text>
<text class="serif" x="170" y="490" font-size="13.5" fill="#b9b2cc">reasoning that holds up no matter who is looking.</text>
<rect x="170.0" y="502" width="68.2" height="22" rx="11" fill="#171421" stroke="#3a3350"/><text x="204.1" y="517" font-size="11" text-anchor="middle" fill="#cdbfff" textLength="46.2" lengthAdjust="spacing">physics</text>
<rect x="246.2" y="502" width="94.6" height="22" rx="11" fill="#171421" stroke="#3a3350"/><text x="293.5" y="517" font-size="11" text-anchor="middle" fill="#cdbfff" textLength="72.6" lengthAdjust="spacing">mathematics</text>
<rect x="348.8" y="502" width="107.8" height="22" rx="11" fill="#171421" stroke="#3a3350"/><text x="402.7" y="517" font-size="11" text-anchor="middle" fill="#cdbfff" textLength="85.8" lengthAdjust="spacing">jee main 2027</text>
<rect x="464.6" y="502" width="154.0" height="22" rx="11" fill="#171421" stroke="#3a3350"/><text x="541.6" y="517" font-size="11" text-anchor="middle" fill="#cdbfff" textLength="132.0" lengthAdjust="spacing">scientific reasoning</text>
<rect x=".75" y="544.75" width="898.5" height="124.5" rx="14" fill="#100e18" stroke="#2a2538" stroke-width="1.5"/>
