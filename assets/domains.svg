<rect x="627.2" y="230" width="81.4" height="22" rx="11" fill="#171421" stroke="#3a3350"/><text x="667.9" y="245" font-size="11" text-anchor="middle" fill="#cdbfff" textLength="59.4" lengthAdjust="spacing">tailscale</text>
<rect x="716.6" y="230" width="41.8" height="22" rx="11" fill="#171421" stroke="#3a3350"/><text x="737.5" y="245" font-size="11" text-anchor="middle" fill="#cdbfff" textLength="19.8" lengthAdjust="spacing">ssh</text>
<rect x=".75" y="272.75" width="898.5" height="124.5" rx="14" fill="#100e18" stroke="#2a2538" stroke-width="1.5"/>
