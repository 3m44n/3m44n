<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" width="100%" height="390">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="100%" stop-color="#0f1526" />
    </linearGradient>

    <linearGradient id="archGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dcfff" />
      <stop offset="60%" stop-color="#7aa2f7" />
      <stop offset="100%" stop-color="#bb9af7" />
    </linearGradient>

    <filter id="archGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono-title {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 15px;
      font-weight: 700;
      fill: #7dcfff;
      letter-spacing: 2px;
    }
    .key {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 13.5px;
      fill: #bb9af7;
    }
    .val {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 13.5px;
      fill: #cbd5e1;
    }
    .quote {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 12px;
      font-style: italic;
      fill: #64748b;
    }
    .orbit-cw {
      transform-origin: 240px 195px;
      animation: spinCW 28s linear infinite;
    }
    .orbit-ccw {
      transform-origin: 240px 195px;
      animation: spinCCW 20s linear infinite;
    }
    .float-logo {
      animation: floatY 5s ease-in-out infinite;
    }
    @keyframes spinCW {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spinCCW {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes floatY {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
  </style>

  <!-- Outer Monolith Frame -->
  <rect width="1000" height="390" rx="14" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1" />

  <!-- Left Column: Giant Animated Arch Linux Crest -->
  <circle cx="240" cy="195" r="145" fill="none" stroke="#1e293b" stroke-width="1" />
  <circle class="orbit-cw" cx="240" cy="195" r="130" fill="none" stroke="#7dcfff" stroke-width="1.2" stroke-dasharray="14 28 6 28" stroke-opacity="0.45" />
  <circle class="orbit-ccw" cx="240" cy="195" r="110" fill="none" stroke="#bb9af7" stroke-width="1" stroke-dasharray="40 60" stroke-opacity="0.35" />

  <!-- Big Arch Linux Vector Logo (Scaled & Centered at 240, 185) -->
  <g class="float-logo">
    <g transform="translate(150, 95) scale(7.5)" filter="url(#archGlow)">
      <path fill="url(#archGrad)" d="M12 0c-.85 2.09-1.36 3.46-2.31 5.49.58.61 1.29 1.32 2.44 2.13-1.24-.51-2.09-1.02-2.72-1.55C8.19 8.61 6.26 12.22 2.4 20c3.05-1.76 5.42-2.85 7.63-3.26-.09-.4-.15-.84-.15-1.29 0-2.29 1.36-4.14 3.04-4.14 1.68 0 3.04 1.85 3.04 4.14 0 .45-.06.89-.15 1.29 2.21.41 4.58 1.5 7.63 3.26-.6-1.15-1.14-2.19-1.65-3.18-.81-.63-1.66-1.45-3.39-2.34 1.19.31 2.04.67 2.7 1.07-3.44-6.42-3.72-7.27-9.1-15.55z"/>
    </g>
  </g>

  <text x="240" y="362" text-anchor="middle" class="quote">ARCH LINUX  //  KERNEL TO COMPOSITOR</text>

  <!-- Vertical Divider -->
  <line x1="460" y1="45" x2="460" y2="345" stroke="#1e293b" stroke-width="1" />

  <!-- Right Column: Clean Fastfetch Terminal Readout -->
  <g transform="translate(505, 62)">
    <text x="0" y="0" class="mono-title">nur@enigma.sys</text>
    <line x1="0" y1="14" x2="430" y2="14" stroke="#1e293b" stroke-width="1" />

    <text x="0" y="44" class="key">os        ▸</text>
    <text x="115" y="44" class="val">Arch Linux (x86_64)</text>

    <text x="0" y="74" class="key">wm        ▸</text>
    <text x="115" y="74" class="val">Hyprland (Wayland) · fish</text>

    <text x="0" y="104" class="key">node_02   ▸</text>
    <text x="115" y="104" class="val">Xiaomi Redmi 8 (aarch64 Linux)</text>

    <text x="0" y="134" class="key">services  ▸</text>
    <text x="115" y="134" class="val">Docker · Tailscale · Jellyfin · rclone</text>

    <text x="0" y="164" class="key">science   ▸</text>
    <text x="115" y="164" class="val">Physics &amp; Mathematics (IIT-JEE 2027)</text>

    <text x="0" y="194" class="key">canon     ▸</text>
    <text x="115" y="194" class="val">Monster · Vagabond · Dune · Interstellar</text>

    <line x1="0" y1="222" x2="430" y2="222" stroke="#1e293b" stroke-width="1" />

    <!-- Palette Swatches -->
    <circle cx="12" cy="252" r="7" fill="#7dcfff" />
    <circle cx="36" cy="252" r="7" fill="#7aa2f7" />
    <circle cx="60" cy="252" r="7" fill="#bb9af7" />
    <circle cx="84" cy="252" r="7" fill="#9ece6a" />
    <circle cx="108" cy="252" r="7" fill="#e0af68" />
    <circle cx="132" cy="252" r="7" fill="#f7768e" />

    <text x="430" y="256" text-anchor="end" class="quote">[ STATUS: ONLINE ]</text>
  </g>
</svg>