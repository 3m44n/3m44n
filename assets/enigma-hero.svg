<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911" />
      <stop offset="50%" stop-color="#0d1322" />
      <stop offset="100%" stop-color="#131129" />
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7dcfff" stop-opacity="0" />
      <stop offset="50%" stop-color="#7dcfff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#bb9af7" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7dcfff" stop-opacity="0.14" />
      <stop offset="60%" stop-color="#bb9af7" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#060911" stop-opacity="0" />
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#7dcfff" stroke-width="0.4" stroke-opacity="0.06" />
    </pattern>
  </defs>

  <style>
    .arabic {
      font-family: 'Amiri', 'Traditional Arabic', 'Scheherazade New', serif;
      font-size: 28px;
      fill: #7dcfff;
      letter-spacing: 2px;
      animation: breathe 5s ease-in-out infinite;
    }
    .title {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 46px;
      font-weight: 700;
      fill: #e2e8f0;
      letter-spacing: 14px;
    }
    .sub {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 12px;
      fill: #94a3b8;
      letter-spacing: 6px;
    }
    .hud {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      fill: #475569;
      letter-spacing: 2px;
    }
    .star {
      fill: #7dcfff;
      animation: twinkle 4s ease-in-out infinite;
    }
    .scanline {
      animation: scan 6s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { opacity: 0.75; }
      50% { opacity: 1; }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 0.8; }
    }
    @keyframes scan {
      0%, 100% { transform: translateX(-250px); opacity: 0.3; }
      50% { transform: translateX(250px); opacity: 0.9; }
    }
  </style>

  <!-- Deep Void Background -->
  <rect width="1000" height="280" rx="14" fill="url(#bg)" stroke="#1e293b" stroke-width="1" />
  <rect width="1000" height="280" rx="14" fill="url(#grid)" />
  <ellipse cx="500" cy="140" rx="420" ry="130" fill="url(#aura)" />

  <!-- Subtle Starfield -->
  <circle class="star" cx="120" cy="60" r="1.2" />
  <circle class="star" cx="860" cy="70" r="1.5" style="animation-delay: 1.2s" />
  <circle class="star" cx="220" cy="210" r="1" style="animation-delay: 2.4s" />
  <circle class="star" cx="790" cy="220" r="1.3" style="animation-delay: 0.7s" />
  <circle class="star" cx="640" cy="45" r="1" style="animation-delay: 1.8s" />
  <circle class="star" cx="350" cy="50" r="1.4" style="animation-delay: 3.1s" />

  <!-- Corner HUD Markers -->
  <path d="M 24 44 L 24 24 L 44 24" fill="none" stroke="#7dcfff" stroke-width="1.2" stroke-opacity="0.4" />
  <path d="M 976 44 L 976 24 L 956 24" fill="none" stroke="#7dcfff" stroke-width="1.2" stroke-opacity="0.4" />
  <path d="M 24 236 L 24 256 L 44 256" fill="none" stroke="#7dcfff" stroke-width="1.2" stroke-opacity="0.4" />
  <path d="M 976 236 L 976 256 L 956 256" fill="none" stroke="#7dcfff" stroke-width="1.2" stroke-opacity="0.4" />

  <text x="36" y="40" class="hud">SYS.NODE // ENIGMA</text>
  <text x="964" y="40" text-anchor="end" class="hud">ARCH // HYPRLAND</text>

  <!-- Arabic Greeting (Top Center) -->
  <text x="500" y="78" text-anchor="middle" class="arabic" filter="url(#glow)">ٱلسَّلَامُ عَلَيْكُمْ وَرَحْمَةُ ٱللَّٰهِ</text>

  <!-- Main Enigmatic Identity -->
  <text x="500" y="156" text-anchor="middle" class="title">NUR // ENIGMA</text>

  <!-- Animated Horizon Divider -->
  <line x1="200" y1="184" x2="800" y2="184" stroke="url(#cyanGlow)" stroke-width="1" />
  <g class="scanline">
    <line x1="440" y1="184" x2="560" y2="184" stroke="#7dcfff" stroke-width="2.5" filter="url(#glow)" />
  </g>

  <!-- Subtitle -->
  <text x="500" y="218" text-anchor="middle" class="sub">MINIMAL SYSTEMS  ·  MAXIMUM CURIOSITY</text>
</svg>