<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 188" width="900" height="188" role="img" aria-label="wassalam, end of transmission">
<title>wassalam, end of transmission</title><desc>Closing panel with a small rotor, the Arabic sign-off wassalam, a line about signals, and a blinking cursor after the words end of transmission.</desc>
<defs><linearGradient id="fl" x1="0" x2="1"><stop offset="0" stop-color="#cdbfff" stop-opacity="0"/><stop offset="1" stop-color="#cdbfff" stop-opacity=".4"/></linearGradient><linearGradient id="fr" x1="0" x2="1"><stop offset="0" stop-color="#cdbfff" stop-opacity=".4"/><stop offset="1" stop-color="#cdbfff" stop-opacity="0"/></linearGradient></defs>
<style>text{font-family:'JetBrains Mono','Fira Code','Cascadia Code','SF Mono',ui-monospace,'DejaVu Sans Mono',Menlo,Consolas,monospace}.sans{font-family:'Inter','Helvetica Neue','Segoe UI',system-ui,-apple-system,'Noto Sans',sans-serif}.serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Noto Serif',serif}.ar{font-family:'Amiri','Noto Naskh Arabic','Scheherazade New','Traditional Arabic','Geeza Pro','Segoe UI','DejaVu Sans',serif}.b{font-weight:700}@keyframes cw{to{transform:rotate(360deg)}}@keyframes ccw{to{transform:rotate(-360deg)}}@keyframes bl{0%,50%{opacity:1}50.01%,100%{opacity:0}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes tw{0%,100%{opacity:.1}50%{opacity:.7}}@keyframes fi{from{opacity:0}to{opacity:1}}.bl{animation:bl 1.1s steps(1,end) infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>

<rect x=".75" y=".75" width="898.5" height="186.5" rx="14" fill="#100e18" stroke="#2a2538" stroke-width="1.5"/>
<rect x="60" y="38" width="320" height="1" fill="url(#fl)"/><rect x="520" y="38" width="320" height="1" fill="url(#fr)"/>
<g transform="translate(450 38)"><circle r="14" fill="#100e18" stroke="#cdbfff" stroke-opacity=".35"/><g style="animation:cw 40s linear infinite"><circle r="19" fill="none" stroke="#cdbfff" stroke-opacity=".4" stroke-width="5" stroke-dasharray="2 3.969"/></g>
<circle r="3" fill="#cdbfff"/></g>
<text class="ar" x="450" y="92" font-size="28" text-anchor="middle" fill="#e7e1f2" direction="rtl">وَالسَّلَامُ</text>
<text x="454" y="114" font-size="10.5" text-anchor="middle" fill="#8e88a0" letter-spacing="7">wassalam</text>
<text class="serif" x="450" y="144" font-size="15" font-style="italic" text-anchor="middle" fill="#b9b2cc">Not every signal is meant to be decoded.</text>
<text x="386" y="170" font-size="12" fill="#5b566b" textLength="115" lengthAdjust="spacing">end of transmission</text>
<rect class="bl" x="510" y="159" width="7.5" height="14" rx="1.5" fill="#cdbfff" opacity=".85"/>
</svg>
